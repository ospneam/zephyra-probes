[package]
name = "video-lab"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["d3d12"]
d3d12 = ["dep:zephyra-winit-d3d12"]

[dependencies]
zephyra-core = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", branch = "main", package = "zephyra-core" }
zephyra-fx = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", branch = "main", package = "zephyra-fx" }
zephyra-winit-d3d12 = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", branch = "main", package = "zephyra-winit-d3d12", optional = true }
# 外部纹理句柄与 FrameId。
zephyra-ext = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", branch = "main", package = "zephyra-ext" }
# 解码 + 帧→FrameDesc。
zephyra-media = { git = "https://github.com/Aura-Zephyrus/ZephyraCore.git", branch = "main", package = "zephyra-media", features = ["video-h264", "aac", "audio"] }
winit = "0.30"
